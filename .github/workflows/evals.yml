name: skill checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q scripts tools evals
      - name: Lint
        if: matrix.python-version == '3.11'
        run: python -m pip install ruff==0.17.3 && ruff check scripts tools evals
      - name: Check skill and regressions
        run: python evals/check.py
      - name: Build standalone skills
        run: |
          python tools/package_skill.py
          python tools/package_skill.py --skill unslop-write
      - uses: actions/upload-artifact@v4
        with:
          name: unslop-skill-python-${{ matrix.python-version }}
          path: dist/*.skill
